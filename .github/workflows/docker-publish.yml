name: Build and publish Docker image
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dockerhub_token:
        description: Docker Hub access token for this run
        required: true
        type: string
env:
  IMAGE_NAME: stars7/duck-panel
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Select Docker Hub token
        shell: bash
        env:
          INPUT_TOKEN: ${{ inputs.dockerhub_token }}
          SAVED_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          TOKEN="${INPUT_TOKEN:-${SAVED_TOKEN}}"
          if [[ -z "$TOKEN" ]]; then echo 'Docker Hub token required'; exit 1; fi
          echo "::add-mask::$TOKEN"
          echo "DOCKERHUB_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: stars7
          password: ${{ env.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: docker.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
